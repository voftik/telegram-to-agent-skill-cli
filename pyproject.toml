[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-to-agent-skill-cli"
version = "0.7.0.dev0"
description = "Telegram context for coding agents: local sync, FTS5 search, attachments, links, threads — a tg-cli fork with an agent skill"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "jackwener", email = "jakevingoo@gmail.com" }]
maintainers = [{ name = "voftik" }]
keywords = ["telegram", "tg", "cli", "telethon", "search", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    "telethon>=1.36",
    "click>=8.3.3",     # PYSEC-2026-2132
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    # PEP 440 version comparison for `tg update` — never hand-rolled:
    "packaging>=23",
    # Security floors for transitive dependencies (audit #36):
    "pyasn1>=0.6.4",    # PYSEC-2026-2263 (via telethon→rsa)
    "pygments>=2.20.0",  # PYSEC-2026-2987 (via rich)
]

[project.urls]
Homepage = "https://github.com/voftik/telegram-to-agent-skill-cli"
Repository = "https://github.com/voftik/telegram-to-agent-skill-cli"
Issues = "https://github.com/voftik/telegram-to-agent-skill-cli/issues"
Upstream = "https://github.com/jackwener/tg-cli"


[project.scripts]
tg = "tg_cli.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_cli"]

[tool.hatch.build.targets.sdist]
# Contract (#33): the sdist is a full source snapshot that reproduces the
# agent integration (canonical skill + installer + docs); the wheel ships
# runtime code only. scripts/check_dist.py enforces this in CI.
include = [
    "src/tg_cli",
    "README.md",
    "README.ru.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SCHEMA.md",
    "skill",
    "docs",
    "install.sh",
    ".env.example",
    "examples",
    "tests",
]

[tool.pytest.ini_options]
addopts = "-v"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
    "twine>=6.1.0",
]

[tool.ruff.lint.per-file-ignores]
# Frozen marker-guarded snippets must stay byte-identical to what is
# already appended on user machines — they cannot be wrapped.
"src/tg_cli/skillpkg.py" = ["E501"]
